name: projeto_jungle_gamming

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sleep infinity
    volumes:
      - ../:/workspace:cached
    environment:
      PORT: 3000
      DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet
      TEST_DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet_test
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - '3000:3000'
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wallet -d wallet']
      interval: 2s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - '4566:4566'
