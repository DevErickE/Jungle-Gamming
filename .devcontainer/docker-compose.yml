# Override usado só pelo devcontainer: acrescenta a aplicação ao docker-compose.yml da raiz,
# que já define PostgreSQL e LocalStack. Assim os serviços de infra não são duplicados.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    working_dir: /workspace
    volumes:
      # Caminhos relativos são resolvidos a partir da raiz do projeto (primeiro arquivo do compose).
      - .:/workspace:cached
    environment:
      PORT: 3000
      DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet
      TEST_DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet_test
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - '3000:3000'
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
